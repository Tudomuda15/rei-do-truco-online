<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rei do Truco Online</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell">
<header><div class="crown">👑</div><h1>REI DO TRUCO <span>ONLINE</span></h1><p>O seu lugar é na mesa!</p></header>
<section class="panel" id="lobby">
<label>Seu apelido<input id="name" maxlength="18" value="Jogador"></label>
<label>Modo de truco<select id="mode"><option value="paulista">Truco Paulista</option><option value="mineiro">Truco Mineiro</option></select></label>
<div class="buttons"><button id="create">Criar sala</button></div>
<label>Código da sala<input id="code" placeholder="Ex.: A1B2C3" maxlength="6"></label><button id="join" class="secondary">Entrar em sala</button>
<p id="status" class="status">Crie uma sala ou entre com um código.</p></section>
<section class="panel game" id="game" hidden>
<div class="roomline"><strong>Sala <span id="roomcode"></span></strong><span id="modeLabel"></span></div>
<div class="players" id="players"></div><div class="score" id="score"></div>
<div class="table"><p id="message">Esperando partida...</p><div id="played"></div></div>
<button id="start">Iniciar partida (4 jogadores)</button><div class="hand" id="hand"></div>
<button id="leave" class="secondary">Sair da sala</button>
</section><footer>MVP de demonstração • fichas virtuais • sem apostas em dinheiro real</footer>
</main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
